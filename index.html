<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#16181f" />
  <title>SHELL // Minimalist Puzzle Platformer</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23ff5a5f'/><circle cx='12' cy='18' r='3.5' fill='white'/><circle cx='20' cy='18' r='3.5' fill='white'/></svg>" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <!-- Minimalist Top Navigation Bar -->
    <header id="hud-bar">
      <div class="hud-group">
        <button class="hud-btn" id="btn-levels" aria-label="Levels" title="Level Select (Esc)">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <rect x="3" y="3" width="7" height="7" rx="1.5"></rect>
            <rect x="14" y="3" width="7" height="7" rx="1.5"></rect>
            <rect x="3" y="14" width="7" height="7" rx="1.5"></rect>
            <rect x="14" y="14" width="7" height="7" rx="1.5"></rect>
          </svg>
        </button>
        <button class="hud-btn" id="btn-restart" aria-label="Restart" title="Restart Level (R)">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
            <path d="M3 3v5h5"></path>
          </svg>
        </button>
        <button class="hud-btn" id="btn-mute" aria-label="Toggle Audio" title="Mute / Unmute (M)">
          <svg id="icon-sound-on" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
          </svg>
          <svg id="icon-sound-off" class="hidden" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <line x1="23" y1="9" x2="17" y2="15"></line>
            <line x1="17" y1="9" x2="23" y2="15"></line>
          </svg>
        </button>
      </div>

      <div class="hud-center">
        <span id="hud-level-num" class="hud-pill">05 / 24</span>
        <span id="hud-level-title" class="hud-title">The Shell Citadel</span>
        <div id="hud-layers" class="hud-layers" title="Current Nested Shell Layers"></div>
      </div>

      <div class="hud-group">
        <button class="hud-btn hud-btn-text" id="btn-hint" title="Toggle Solution Hint (H)">
          <span>Hint</span>
        </button>
        <button class="hud-btn hud-btn-text hud-btn-accent hidden" id="btn-skip" title="Skip to Next Level">
          <span>Skip →</span>
        </button>
      </div>
    </header>

    <!-- Game Stage -->
    <main id="stage">
      <canvas id="game-canvas" width="928" height="592"></canvas>
    </main>

    <!-- Mobile-Friendly Ergonomic Touch Controls -->
    <footer id="touch-controls" aria-label="Touch Controls">
      <div class="touch-dpad" id="dpad-zone">
        <button class="touch-btn" id="touch-left" aria-label="Move Left">
          <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </button>
        <button class="touch-btn" id="touch-right" aria-label="Move Right">
          <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </button>
      </div>

      <div class="touch-actions">
        <button class="touch-btn touch-jump-btn" id="touch-jump" aria-label="Jump or Shed Shell">
          <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="18 15 12 9 6 15"></polyline>
          </svg>
          <span class="jump-sub" id="jump-label">JUMP</span>
        </button>
      </div>
    </footer>
  </div>

  <script src="audio.js?v=3"></script>
  <script src="levels.js?v=3"></script>
  <script src="game.js?v=3"></script>
</body>
</html>
